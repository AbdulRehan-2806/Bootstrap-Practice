<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container py-4">
        <h3 class="mb-3">Button Groups</h3>
        <div class="btn-group" role="group">
            <button type="button" class="btn btn-outline-primary">Left</button>
            <button type="button" class="btn btn-outline-primary">Middle</button>
            <button type="button" class="btn btn-outline-primary">Right</button>
        </div>

        <h3 class="mt-4 mb-3">Toggle Buttons with Checkboxes</h3>
        <div class="btn-group" role="group">
            <input type="checkbox" class="btn-check" id="option1" autocomplete="off">
            <label class="btn btn-outline-primary" for="option1">Option 1</label>

            <input type="checkbox" class="btn-check" id="option2" autocomplete="off">
            <label class="btn btn-outline-primary" for="option2">Option 2</label>

            <input type="checkbox" class="btn-check" id="option3" autocomplete="off">
            <label class="btn btn-outline-primary" for="option3">Option 3</label>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
